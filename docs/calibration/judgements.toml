# The classifications behind docs/calibration-2026-09.md.
#
# weed counts what it blocked; whether a block was right is a person's reading
# of the diff, and this is where that reading is written down. One entry per
# blocked commit: the repository, the full sha, the class, and one line saying
# what was found and why that is the answer.
#
#   true-positive   the change really did what the rule says it did
#   acceptable      the finding's claim is true and the change was fine anyway,
#                   so the block is friction the rule was designed to create
#   false-positive  the finding's claim is not true of this change
#
# A blocked commit with no entry here counts as a false positive, so the bar can
# only be met by reading the diffs. `[commit.rules.<RULE>]` gives one rule of a
# multi-rule block its own class and its own line, where it deserves one.

