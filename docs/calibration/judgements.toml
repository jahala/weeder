# The classifications behind docs/calibration-2026-09.md.
#
# weed counts what it blocked; whether a block was right is a person's reading
# of the diff, and this is where that reading is written down. One entry per
# blocked commit: the repository, the full sha, the class, and one line saying
# what the finding claims and why that is the answer.
#
# The class follows the finding's own sentence, and nothing else:
#
#   false-positive  what the finding says is untrue of this change
#   acceptable      what it says is true and the change was fine anyway, so the
#                   block is friction the rule was designed to create
#   true-positive   what it says is true and something really was weakened
#
# A finding says more than a count. `21 assertions went out of this file ... so
# the suite reports green over behaviour nobody is holding` claims a count and a
# consequence, and where the same change puts those assertions in another file
# the consequence is untrue, whatever the count says. That is a false positive
# here, and how welcome the change was never enters it.
#
# A blocked commit with no entry here counts as a false positive, so the bar can
# only be met by reading the diffs. `[commit.rules.<RULE>]` gives one rule of a
# multi-rule block its own class and its own line, where it deserves one.

