# The history calibration judges: the five garden repositories, each named by a
# source `git fetch` can read and by the full sha its window ends at.
#
# The pin is what makes the report a measurement. A default branch moves, and a
# report taken against "whatever it says today" is a different report tomorrow;
# a report taken against a sha is the same report until somebody edits this file.
# Moving a pin is a deliberate edit, and the run after it is a new measurement
# whose newly blocked commits have to be classified before the bar can be read.
#
# No entry names a directory on any one machine, so the corpus is judgeable
# wherever these sources are reachable. `cargo xtask calibrate --repo
# <name>=<source>@<sha>` points an entry somewhere else, which is how the suites
# run against a history they built themselves.

