# rules-block — the eight findings that stop a commit
**Goal.** The rules that block by default, because each names a shape no honest change has: a deleted test, an added skip or focus, a stub in production code, a secret, an edited guardrail, a conflict marker (G1, already live on check-face), a NUL in a text source file that hides every later diff of it (G3), and a check the project runs made unable to fail by its own settings (C4). Each lands as a failing fixture first in TypeScript/JavaScript, Python, Rust and Go, then the detector, and each has a neighbour fixture where it must stay silent. A rule detects a shape, never a vendor or a product name.

## The rules

| Id | Finding | Detection |
|---|---|---|
| T1 | test deleted: a test file removed, or a test case removed from a changed test file | file classification plus a case count from the reader's test shape, HEAD against tree |
| T3 | skip or focus added: `.skip`, `.only`, `xit`, `xdescribe`, `test.todo`, `@pytest.mark.skip`, `@pytest.mark.xfail`, `@unittest.skip`, `#[ignore]`, `t.Skip(`, `t.SkipNow(` | added lines in test files, matched as syntax not as substrings inside strings or comments |
| S1 | stub or TODO in production code: `TODO`, `FIXME`, `XXX`, `unimplemented!`, `todo!`, `NotImplementedError`, `throw new Error('not implemented')`, `panic("not implemented")`, a function body that is only `pass`, `return null`, `return nil`, or `...` | added lines in prod files, plus the reader's outline for the body-only shape |
| X1 | secret-looking string added: a known prefix (`AKIA`, `ghp_`, `github_pat_`, `sk-`, `xox[bpoas]-`, `AIza`, `glpat-`, `npm_`, a private key block, a signed JWT) or a high-entropy literal assigned to a key-like name (`key`, `secret`, `token`, `password`, `credential`) | added lines in any file; the entropy path needs both the name and a Shannon entropy above 4.0 over 20 or more characters |
| C1 | guardrail edited: `.github/workflows/*`, `.claude/settings*.json`, `.gemini/settings.json`, `.codex/*`, `weeder.toml`, `.githooks/*`, the hard-limits section of `AGENTS.md` or `CLAUDE.md` | path classification; for the two markdown files only a hunk touching a section whose heading contains "hard limits" |
| G3 | control character added: a NUL blocks, every other control character but tab, newline and carriage return warns | added lines of a file read as text by its path or counted as text at the base, net of what the removed lines carried, so a byte the base held is not reported again |
| C4 | gate loosened: a CI step that runs a check made unable to fail, a manifest's check script made a no-op, blocks; a gate's own setting loosened (a coverage threshold lowered, a strictness switch off, codes added to a lint ignore) and a check step dropped from a workflow that gates warn | the workflow's steps and the manifest's scripts read by structure on both sides, a step counted as a check by the command its `run:` names; settings read by key from the file's kind, the way T8 reads a runner's |

## What a test case is, per language

TypeScript/JavaScript: a call to `it`, `test`, `describe` (and their `.each` forms) under vitest, jest or `node:test`. Python: a function or method whose name starts with `test` in a test file, under pytest or `unittest`. Rust: a function under `#[test]` or `#[tokio::test]`. Go: a function `TestXxx(t *testing.T)`, and subtests via `t.Run`. A case count that drops in a changed test file is T1; a file removed whose classification is test is T1.

## Silence

Each rule has a neighbour that looks close and is honest: a test renamed in place, a `skip` inside a string, a `TODO` in a comment inside a test file, a `key` variable holding a short config name, a workflow file added rather than edited (still C1: any change to a guardrail path is the finding, and the neighbour for C1 is an edit to `.github/CODEOWNERS`, which is not a guardrail).
