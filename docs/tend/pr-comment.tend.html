# pr-comment — weeder's verdict on the pull request, in one comment
**Goal.** A repository that adds weeder to its pull requests gets weeder's verdict where the reviewer already is: one comment on the pull request, written on the first run and edited in place on every push after, never a second one. It says plainly when there is nothing to report. When there is, it lists each finding with its rule, its level and its message, linked to the line it names. It asks for nothing beyond `pull-requests: write`. On a pull request from a fork, where GitHub gives the job no right to write, it puts the same text in the job summary and leaves the verdict to weeder's exit code rather than failing on the comment. It ships as a GitHub Action in this repository, used by a tag, and the copy-paste example in `examples/ci/github.yml` uses it, so installing and running weeder in CI has one home. The owner said yes to it on 2026-11-13.

## Tests
- [x] (code) given a SARIF log weeder wrote, the comment renderer writes one markdown body that opens with a hidden marker naming weeder; says in one sentence that nothing was found when the log holds no result; and otherwise lists every result, blocks first, each with its rule id, its level, its message and a link to `<server>/<repository>/blob/<head sha>/<path>#L<line>`; the same log writes the same bytes · tests/action_comment.rs @aa295d56836910 · by cli
- [x] (code) the action asks for `contents: read` and `pull-requests: write`, and `security-events: write` only where it sends the findings to code scanning, which it does by itself from a public repository except on a fork's pull request and from a private one only when told `on`, with no step told it may fail, never runs on `pull_request_target`, installs the release tarball for the runner after checking its SHA-256, fails the job when `weeder check` exits 2 or 3, and only after the comment or the summary is written; a comment that cannot be written never changes the job's result · tests/action_comment.rs @965a8f46836910 · by cli
- [x] (code) on a pull request in this repository, two pushes leave exactly one comment carrying the marker, edited by the second run, and its text matches the second run's findings; a leg of the same workflow run with `pull-requests: read` cannot write, puts the body in its job summary and passes; the writing leg's findings reach code scanning; the evidence reads both from GitHub · scripts/check/action-comment.sh @d1c8b5aa3b6c5b · by cli
- [ ] (human) the owner reads the comment on a real pull request, once with findings and once with none, and approves how it reads

## Tried
- 2026-11-13 shaped on plotplot's work order after the owner's yes to a pull-request comment that keeps itself current ("ok, then we should do that"). Out of scope until the owner asks: hooks for other agents, an MCP review tool, a replay of past commits
- 2026-11-13 the action replaces the hand-written install in `examples/ci/github.yml` rather than sitting beside it, so a change to how weeder is installed in CI is made once. The release loop's check on that example (`scripts/check/ci-example.sh`) is re-earned against the action when it lands
- 2026-11-13 a fork's pull request is answered in the job summary rather than by switching to `pull_request_target`, which would run the fork's code with a token that can write
- 2026-11-13 built. The markdown is rendered by the binary, `weeder check --format markdown`, from the same SARIF log `--format sarif` writes (`core::comment::render`), so the comment and the log cannot disagree, the order has one home, and the suite and the determinism promise cover it. The links come from `--link-base <url>`, which the action builds from the server, the repository and the head sha; core reads no environment and the binary stays offline. `--link-base` without `--format markdown` exits 3. `scan` and `bite` are not offered the format
- 2026-11-13 the action installs the release that `garden.json` at the action's own ref names for the runner (`install.binaries`), so `uses: jahala/weeder@vX` installs vX and the action's flags always match its binary, with no version input to drift; `uses: ./` reads its tree's manifest the same way. The one input that changes what is installed is `archive`, a URL with its `.sha256` beside it, fetched and digest-checked like the release. `comment.yml` and `ci-example.sh` use it to install a weeder built from the tree, because a tree ahead of its release judges with a format the release does not have
- 2026-11-13 check 3 is proved by `.github/workflows/comment.yml`, which runs `uses: ./` on every pull request in two jobs: `write`, and `read` with `pull-requests: read`, standing in for a fork. `scripts/check/action-comment.sh` reads the runs, the jobs' logs and the comments over the API. The summary step also prints the body into a folded group of the log, because the API serves a job's log and not its summary
- 2026-11-13 the comment step edits the oldest comment that opens with the marker, writes nothing when the pull request has moved past the judged commit (only the newest verdict changes the comment), and the example and `comment.yml` cancel a superseded run. The summary is written on every run, not only where the comment fails
- 2026-11-13 the example no longer uploads SARIF to code scanning: check 2 allows `contents: read` and `pull-requests: write` alone, and the upload needs `security-events: write`. A repository that copies the example gets the comment in place of code-scanning annotations; putting the upload back is the owner's call. garden-fit's check on the example still describes the upload, and its stamp is history
- 2026-11-13 the example names `jahala/weeder@v<the Cargo.toml version>` and `tests/action_comment.rs` holds the two equal, so the release that bumps the version moves the example in the same change. Until the first release that carries `action.yml`, the tag the example names has no action in it
- 2026-11-13 first live run on #168: Comment run 43431384706 passed both legs; the write leg created comment 6853936668 carrying the marker, three warnings (C3 on the new workflow, D1 twice on the manifest), each linked to its line at the head sha; the read leg passed with the body in its job summary. The comment's messages open in lowercase, as the log's do, which is check 4's to judge
- 2026-11-13 the owner's ruling on code scanning (through plotplot): the comment is the default and the upload stays, chosen by the repository's kind. The upload lives in the action rather than the example, because a composite action's outputs are not dependable after the action fails, and a blocking run is the one whose annotations matter. `auto` uploads from a public repository and never from a fork's pull request, whose token cannot upload; a private repository opts in with the variable `WEEDER_CODE_SCANNING=on`, since GitHub does not tell a workflow whether Advanced Security is on. No step is told it may fail: an upload that was asked for and failed fails the job. The judge step writes SARIF beside the comment and refuses the run where the two verdicts differ
