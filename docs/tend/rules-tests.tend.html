# rules-tests — how a test suite gets quietly weaker
**Goal.** The rules that read the change to a test suite and name each way it can become weaker without anyone deleting a test: assertions dropped, a tolerance widened, expected values regenerated, an error assertion loosened, a test uncollected by rename, and a mock placed over the very unit under change; and each way a case can be added that cannot fail, asserting nothing at all or asserting what cannot change. T2 blocks by default; the rest warn, for the human at the pull request. Each lands as a failing fixture first in TypeScript/JavaScript, Python, Rust and Go, with a silent neighbour.

## The rules

| Id | Finding | Default | Detection |
|---|---|---|---|
| T2 | assertions dropped in a changed test file with no allowance | block | assertion count HEAD against tree per test file: `expect(`, `assert`, `assert.*`, `should`, `assert_eq!`, `assert_ne!`, `assert!`, `t.Error`, `t.Fatal`, `require.`, `assert.` (testify), `self.assert*` |
| T4 | tolerance widened: a numeric literal in an approximate assertion or a timeout increased | warn | paired removed/added lines within a hunk, the same assertion shape with a larger number: `toBeCloseTo`, `approx`, `pytest.approx`, `abs_diff`, `assert!((a - b).abs() < x)`, `math.Abs`, `timeout`, `setTimeout`, `time.sleep`, `Duration::from_` |
| T5 | expected values regenerated: snapshot, golden or fixture files changed alongside production code | warn | `__snapshots__/`, `*.snap`, `testdata/`, `golden/`, `fixtures/`, `*.golden`, `*.approved.*` changed in a diff that also changes a prod file |
| T6 | error assertion weakened: a specific message or type became any error | warn | paired lines: `toThrow('x')` → `toThrow()`, `pytest.raises(X, match=)` → `pytest.raises(Exception)`, `assert_eq!(err, X)` → `is_err()`, `errors.Is(err, X)` → `err != nil` |
| T7 | test uncollected by rename: a test file or case renamed so the runner no longer collects it | block | rename detection plus naming conventions: `*.test.ts`/`*.spec.ts`, `test_*.py`/`*_test.py`, `#[test]` kept, `*_test.go` and `TestXxx` |
| T9 | an added case asserts nothing: no line of it asserts, it expects no failure, and no helper of its file it calls asserts | warn | each case the change adds read on its own lines through the vocabulary T2 counts with, `[tests] assertions` included; a case declared to expect a failure (`#[should_panic]`) or to return one and handing one back (`-> Result` with `?`) asserts; a call to a function the same file defines is followed one level into that function's lines |
| T10 | an added case restates a constant of the code: every check compares one name the code defines with a literal | warn | `subject::read` on each check of a case the change adds: exact, one subject, a literal on the other side, a bare name not bound in the case, imported, defined beside its tests, or reached through Go's package scope or a glob import |
| T11 | an added case asserts only on a double it built and hands to nothing | warn | each check of a case the change adds reads a name the case bound to a double (the mock words, or a script `fn` member called), directly or through a value read off it, and the double is never written as an argument or a value |
| T12 | an added case only checks that a string it passed in came back out | warn | each check of a case the change adds holds its subject to a string literal, outside the subject, that the case wrote earlier on a line that is no check |
| M1 | mock over the unit under change: a test in the diff mocks a module whose production file is also in the diff; and a double the change sets up of what the test is about, inside the change or not | warn | mock specifiers (`vi.mock`, `jest.mock`, `unittest.mock.patch`, `mockall`, `gomock`) resolved against the diff's prod paths through the reader's import resolution; a double on an added line read against the file the test file is named for and the title of the added case it serves |

tend2's `src/verify/mock.ts` (in tend2's own repository, github.com/jahala/tend) is prior art for M1 on TypeScript: read it for the shapes it catches, do not port it.

- 2026-11-11 issue #16 (plotplot's work order, batch 7): T9 lands, warn. The honest neighbours the issue names were already in the vocabulary except Rust's: `t.Error`, `t.Fatal` and their `f` forms are handle members, `toThrow` and `rejects` hang off `expect(`, `assert.rejects` is a member of an assertion receiver, and `pytest.raises` carries the `raises` root. Rust's two went into the same table in `vocab.rs`: `should_panic` as an attribute that expects a failure, and a `Result` return with the `?` that hands one back. A Result-returning case with no `?` still fires: declaring the return checks nothing
- 2026-11-11 the attributes above a Rust test are outside its span, and tilth-core's outline does not carry them. The reader seam already read them to tell a test from a helper, so `TestUnit` now carries them rather than a rule walking the file's lines above a case a second time
- 2026-11-11 decided for #16's open question: a case whose only assertion sits in a helper its own file defines does not fire. The outline names every function of the file with its lines, so T9 follows a call one level into the helper, matched by the last segment of the name it is called by, and reads the helper's lines with the same vocabulary. It goes no deeper: a helper that only calls another helper is reported, and a helper of another file is the repository's to name under `[tests] assertions`. Both edges are held by `tests/rule_t9.rs`, and the silent fixture in every language asserts through such a helper
- 2026-11-11 decided, the lead's call: `?` in a case declared to return `Result` counts as an assertion and `.unwrap()` does not, as #16 specified. Both fail a case on an `Err`, so the line is a dial rather than a fact: counting `unwrap` would silence T9 on most Rust cases that only check a call runs, and it would move T2's count through the shared table. T9 warns, so either reading costs a person one look. The corpus run before the next release reports how many T9 warnings fall on Rust cases whose only failure path is an `unwrap`, and that count decides whether the dial moves
- 2026-11-11 plotplot asked whether T9 warns on Go's table-driven shape, a `TestX` that loops over `t.Run(tc.name, func(t *testing.T) { … t.Errorf … })`. It does not: the test shape names a Go case by its `Test` function and not by its subtests, so the closures' lines are the case's own and their assertions count. The test that says so pairs an asserting table with one whose subtest checks nothing, which reports the `TestX`. Rust test functions do not nest, and a TypeScript runner refuses an `it` inside an `it`, so Go is the language where nesting could have hidden an assertion
- 2026-11-11 the recall planter adds a case beside a suite's last one that builds a value and checks nothing, the way T11 and T12 plant theirs; its reader confirms a new case on the planted lines with no assertion among them. A trial on the xtask test program in all four languages drew T9 and nothing else
