# dogfood-2 — the second round of issues from using weeder on real repositories
**Goal.** The garden's repositories ran 0.3.0 and filed what it got wrong. Each item below was reproduced on the released 0.3.0 on 2026-11-05 (`.context/triage-2026-11-05.md` holds the commands and outputs). Four are false blocks, the costliest kind, since each one stops an honest commit and teaches an agent to write an allowance: X1 on an English sentence under a name with TOKEN in it (#93), S1 on code that imports or tests for a NotImplemented error (#94), S1 reading TypeScript's `todo !== null` as Rust's `todo!` (#95), and T1 reporting a test turned `.skip` as a test that disappeared, beside the T3 that is right (#74). Four are blocking rules missing what they exist for: X1 is blind to secrets in env, YAML and TOML files (#90), C1 guards only a section titled hard limits (#77), `check` says nothing about the bash it cannot read (#79), and S2 misses a one-line empty catch (#75). Four cost every agent context at the moment it is refused: a refused commit prints its findings twice (#78, #88), identical findings repeat their whole why and next (#83), T8 lists 235 tests as hidden by a `setupFiles` line (#96), and T5's next names no way through (#89). And no repository but weeder can keep its own fixtures out of the rules (#85), designed in #99.

## Tried
- 2026-11-05 shaped from the issues filed between 0.3.0 and today, triaged by reproducing each on the release. Left for a later round: R1 and R2 misreads in `scan`, which never blocks (#70, #71, #76, #82, #86, partly answered by `[[overrides]]` here), T4 pairing the wrong lines inside a new `describe` (#97), and M1 matching a double by its short name (#98). Bash as a fifth judged language (#79) is larger than this round; the note in check 10 makes the gap visible meanwhile. PR #87 was closed: it claimed #85 and changed one line of the npm wrapper into a syntax error
- 2026-11-05 built by two opus workers in their own worktrees, merged by the conductor, checks 1 to 14 stamped. Limits kept on purpose: X1 now reads three or more space-separated words as prose, so a passphrase secret such as `correct horse battery staple` under a key-like name is silent, while an issuer-prefixed secret is still caught; S1 no longer reads a bare `unimplemented` word or a Rust tail expression `Err(Error::NotImplemented)` without `return` as a stub
- 2026-11-05 the move of this repository's own law from `specimens` to `exclude` could not land under either binary: 0.3.0 refuses the new key in the law a change writes, and the new build refuses the base's old one. It landed in ff6ee13 with the hooks bypassed for that one commit, the reason written in its body, and is filed as #100, since every guarded repository meets the same wall at every breaking config change
- 2026-11-05 the corpus re-measurement read six new C1 blocks from #77's wider headings. Five state law and are classified; one was an edit under `The cockpit, never one number`, where never describes rather than forbids. C1 now reads never only as the word a heading opens with. The same reading found the v1 sunset in tend2 (08529d5f56) dropping `Never delete docs or research` from the instructions entirely: a true positive, classified per rule
- 2026-11-06 batch 2 added three checks above, in plotplot's order. S4's tests and the matrix pass; to keep S1's own tests about S1, four of their assertions now read S1's findings alone, because S1's fixtures add a base class and a helper only a test uses, which is S4's shape. The catalogue matrix still holds every fixture to its own rule and nothing else
- 2026-11-11 #133: on 2026-11-07 ten merged, clean helper worktrees held about 26 GB with the disk at 13 GB free. The prune script is the one home for which worktree may go; the check runs it in report mode. `tests/worktrees.rs` builds the case on a real repository, a merged helper, an open one and one with work left in it
