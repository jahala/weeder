# release — master stays green, and every install route weeder names works
**Goal.** No release run has been green end to end. The tarballs ship; `publish-crate` fails because `tilth-core` is a git dependency (issue #45) and `publish-npm` fails with `ENEEDAUTH` because `NPM_TOKEN` is empty. crates.io and npm both answer 404 for weeder, yet `garden.json` advertises both routes, `npm/install.js` answers every failure with `cargo install weeder`, and `examples/ci/github.yml`, the workflow the README tells people to copy, installs with `npm install -g @plotplot/weeder` and fails at that step. `master` has no branch protection: pull request 49 merged over three red checks and left it red for two days. A test that copies the binary and runs it (`tests/guard_status.rs`) fails with `ETXTBSY` when another test thread forks while the copy is open for writing, and it has turned `master` and a dependabot pull request red. Reproduced on 2026-09-23 (`docs/reviews/2026-09-23-repo-audit.md`, F8, F9, F14, F15).

## Tests
- [x] (code) `examples/ci/github.yml` installs weeder from the release tarball and checks its SHA-256 before it runs, and a scratch repository running that workflow's install and check steps gets weeder's verdict · scripts/check/ci-example.sh @e461a08 · by cli
- [x] (code) `garden.json` names the release tarballs as its install and names no registry route, `npm/install.js` points a failed download at the tarball rather than at `cargo install`, and the manifest test holds both, so a registry route returns to the manifest in the same change that proves its publish job green · tests/garden_manifest.rs @fb75cc5949a8e7 · by cli
- [x] (code) `npm/install.js` checks the archive against the SHA-256 the release publishes before it extracts anything, follows https redirects only and at most five, and extracts the one executable · scripts/check/release.sh @af77104 · by cli
- [x] (code) every test that copies the weeder binary and runs the copy does it through one harness helper that retries an exec refused with `ExecutableFileBusy`, and fifty consecutive release-profile runs of `guard_status` and `guard_planter` on Linux pass · tests/guard_status.rs @d834f8ee162c17 · by cli
- [x] (code) a pull request whose every changed path is prose (markdown, `docs/`, `.brand/`, `LICENSE`) skips the latency job and still runs check; any other path, markdown under `fixtures/` or `tests/`, a file renamed out of code, and a range git cannot answer for all count as code, a path with a newline in it is read whole, a changes job that fails leaves latency running, and a push to master runs both (#35) · tests/ci_changes.rs @7dd2120c6bb56e · by cli
- [ ] (human) the owner requires `check`, `windows` and `latency` to pass before a pull request merges into `master`
- [ ] (human) the owner sets `NPM_TOKEN`, or a trusted publisher on npmjs.com for `release.yml`, and a release run's `publish-npm` is green

## Tried
- 2026-09-23 shaped from the repository audit of the same day. The crate route waits on `tilth-core` reaching crates.io (issue #45) and is not this loop's; until it lands the crate is left out of what `garden.json` names. Issue #44 was closed while `publish-npm` still fails, and issue #33 stays open although `bite` exists and is hidden on purpose; both are the owner's to reopen or close
- 2026-09-23 built by an opus worker in its own worktree, checks 1 to 3 stamped. The flake helper has landed (`run_a_copy` in `tests/common/mod.rs`: it retries an exec refused as busy, and runs the copy once before git does, since a copy that has run once is held open by nobody). It passed fifty release-profile runs on macOS, where ETXTBSY cannot happen, so check 4 waits on Linux: this machine has no container runtime, and CI's ubuntu job is the first place it can be proved
- 2026-11-11 docs-only pull requests stopped paying for the release-profile run (#35). The issue proposed skipping the suite as well, on the reading that prose loses nothing; it does, because `tests/self_check.rs` judges every file and `docs_rules`, `skill_md`, `suppress_token` and `hook_codex` read docs. So check still runs on prose and only latency skips, which is about 9 of the 14 minutes a docs pull request cost (measured on runs 43088492206 and 43078236418). A skipped job reports success to a required check, so the owner's branch-protection check above is unaffected
- 2026-11-11 plotplot's review of #145 found a fail-open: a changes job that failed left latency's `needs` failed, a failed `needs` skips the job, and a skipped job passes a required check. latency now runs on `always()` unless the answer is a plain `false`, and the workflow test pins both
- 2026-11-13 a trial review of #145 found two faults (#159): `git diff --name-only` lists a rename by its new path alone, so a file moved from `src/` to `docs/` read as prose, and `*.md` matched markdown the suite reads under `fixtures/` and `tests/`. The script now takes the range and asks git itself with `--no-renames`, nothing below `fixtures/` or `tests/` is prose, and the tests build real repositories and ranges through the harness rather than handing the script a list
