# recall — does weed catch what it exists to catch
**Goal.** Calibration measures false blocks on real good commits; this loop measures the mirror. `cargo xtask mutate` takes real merged commits from the five garden repos and injects each anti-pattern mechanically, a test case deleted, a `.skip` added, an assertion dropped, a `TODO` body, a swallowed error, a secret, a workflow file edited, one mutation per case, per language, then runs `weed check --base <parent> --strict` and records whether the rule fired on exactly that. Recall for the block-level rules T1, T3, S1, X1, C1 and G1 is at or above 95 percent per language; warn-level rules are reported, aiming at 80. Both numbers sit in `docs/calibration-2026-09.md` beside precision, on real code.

## The injector

One mutation per case so a hit is unambiguous. Per rule, the injector finds a site in a real commit's tree where the shape can be planted (a test file with two or more cases for T1, an `expect` for T2, a production function body for S1, a config assignment for X1, a workflow file for C1, any text file for G1) and plants exactly one instance; a commit with no site for a rule contributes no case for that rule and is counted as such. The corpus is up to the last 200 commits on each repo's default branch, the same commits calibration reads. Cases are written under a temp dir as `before/` and `after/` pairs so a missed case can be replayed by hand with the fixture harness. `docs/calibration-2026-09.md` gains a recall section: per rule, per language, cases, hits, misses, recall, and every miss named by repo, commit and site.

- 2026-09-05 one mutation per case, never several: a hit must be attributable to one rule, and a miss to one site
- 2026-09-06 built by pleach node `recall` (claude/opus, codex audit) in two attempts, 115 minutes: 2608 cases planted in real commits of the five corpus repositories, 2556 caught, 52 missed and every miss named; every block rule at or above 95 percent in each of ts, py, rs and go. The second attempt found the report writer's own `misses()` returning nothing whatever it was handed, which both evidence scripts caught from opposite directions; the worker's notes are in docs/dogfood/recall.md. D2's relative-import resolution was fixed on the way, since the campaign planted `../` imports it could not follow. Landed by hand over calibration: both loops had grown the xtask crate and the report, merged into one bench with one file
