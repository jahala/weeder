# tilth-core — the parsing substrate, and the one seam that touches it
**Goal.** weed reads code through `tilth-core`, a library crate extracted from tilth that owns tree-sitter outlines, file-type and language detection, test-file classification, import extraction and resolution, and caller search across fourteen languages. weed does not parse anything itself. All of that reading sits behind one seam module, `src/seams/reader.rs`, so the core stays pure and the dependency can be swapped or upgraded mechanically.

## The extraction lives in tilth

The crate did not exist when this loop was shaped. almaty, the tilth agent, landed it on 2026-09-05 as branch `garden/tilth-core` at commit 7f38db58696e16c2df2be71da985f47097f34920 (PR #210 on github.com/jahala/tilth): a Cargo workspace whose root package stays `tilth` and whose member `crates/tilth-core` holds the parsing substrate, version 0.10.1 in lockstep with tilth, with tilth's CI trio green, 654 of 654 old tests passing and output parity proven against the v0.10.1 binary. Weed pins that commit as a git dependency; the worktree at `.context/tilth-core` checks out the same commit so the evidence script can run the crate's own suite here.

## What weed asks of the crate

- file-type and language detection for a path (`detect_file_type`, `Lang`, `FileType`)
- outline entries for a file's content and language: name, kind, line range, children (`get_outline_entries`)
- test-file classification by path (`is_test_file`)
- the test structure of a test file: suites and cases with their lines, where the language has such a shape
- import lines, their sources, whether a source is external, and resolution of a relative source to files on disk
- callers of a symbol across a scope, batched, so a rule can name a blast radius or prove an export is dead

## The seam

`src/seams/reader.rs` is the only module in weed that names `tilth_core`. It exposes plain data to the core — `Outline`, `TestShape`, `Import`, `CallerSite`, `FileKind` hints — and nothing tree-sitter-shaped leaks past it. Core rules take those values as arguments; faces call the seam and hand the values in. A test reads the source tree and refuses any other `tilth_core` reference.
