# check-face — the diff judged, from the command line
**Goal.** `weed check` is the primary face: it judges the index plus the working tree against HEAD by default (what pleach's smoke gate sees after it stages a worker's files), `--staged` judges the index alone (the pre-commit face), `--base <ref>` judges the tree against a ref (CI). It prints SARIF when stdout is not a terminal and a table when it is, `--format` overrides, and it exits 0, 2 or 3 as the contract says. `weed rules` prints the catalogue. The git seam lives here, and the first rule runs end to end: G1, conflict markers.

## Flags

```
weed check [--base <ref>] [--staged] [--scope <glob>...] [--strict] [--format sarif|table] [--config <path>] [--message-file <path>]
weed rules [--format table|json]
```

`--scope` names the paths a change may touch. Every file is still judged; a file outside the scope is X2's finding (rules-prod), never a file weed looks away from. `--message-file` hands weed the message of the commit being prepared, for its `Weed-allow:` trailers; a hook passes it, since at pre-commit time no commit exists and git's own `COMMIT_EDITMSG` still holds the previous one. Trailers otherwise count only on the commits of a `--base` range. `--strict` makes suppressions visible but not honoured, and turns a file a rule could not evaluate into a failure to run (exit 3) rather than a skip. `--config` points at a `weed.toml` elsewhere than the repo root.

## The git seam

`src/seams/git.rs` answers: the repository root for a path; the diff for each mode (index and tree against HEAD, index against HEAD, tree against a ref) as unified text with renames detected; a file's content at a ref and in the tree; whether a ref resolves; the commit message for trailers when a range is judged. It shells out to `git` with argument arrays, never a shell string, and every failure is a typed error the face turns into exit 3 with the reason on stderr.

## The fixture harness

`tests/common/mod.rs` is the one way every rule test builds its world: given `fixtures/adversarial/<RULE>/<lang>/<fire|silent>/`, it creates a temp git repository, copies `before/` in and commits it as HEAD (with a fixed author and date so runs are reproducible), replaces the tree with `after/` (files absent from `after/` are deleted; `after/.weed-commit` becomes the pending commit message and is never copied), stages everything, runs the built `weed` binary with `--format sarif` in that repository, and parses the log into results. Every rule loop after this one calls it; none re-implements it. The G1 check below is its first user.

## Fail closed

Not a git repository, an unreadable ref, a config error, or a reader failure under `--strict` is exit 3, one line on stderr saying what could not be done and what to try, and a SARIF log on stdout with `executionSuccessful: false`. A gate that cannot run must never look like a gate that passed.
