# check-face — the diff judged, from the command line
**Goal.** `weed check` is the primary face: it judges the index plus the working tree against HEAD by default (what pleach's smoke gate sees after it stages a worker's files), `--staged` judges the index alone (the pre-commit face), `--base <ref>` judges the tree against a ref (CI). It prints SARIF when stdout is not a terminal and a table when it is, `--format` overrides, and it exits 0, 2 or 3 as the contract says. `weed rules` prints the catalogue. The git seam lives here, and the first rule runs end to end: G1, conflict markers.

## Flags

```
weed check [--base <ref>] [--staged] [--scope <glob>...] [--strict] [--format sarif|table] [--config <path>]
weed rules [--format table|json]
```

`--scope` restricts the judged paths and arms X2 (out of scope) at block level for anything touched outside them. `--strict` makes suppressions visible but not honoured, and turns a file a rule could not evaluate into a failure to run (exit 3) rather than a skip. `--config` points at a `weed.toml` elsewhere than the repo root.

## The git seam

`src/seams/git.rs` answers: the repository root for a path; the diff for each mode (index and tree against HEAD, index against HEAD, tree against a ref) as unified text with renames detected; a file's content at a ref and in the tree; whether a ref resolves; the commit message for trailers when a range is judged. It shells out to `git` with argument arrays, never a shell string, and every failure is a typed error the face turns into exit 3 with the reason on stderr.

## Fail closed

Not a git repository, an unreadable ref, a config error, or a reader failure under `--strict` is exit 3, one line on stderr saying what could not be done and what to try, and a SARIF log on stdout with `executionSuccessful: false`. A gate that cannot run must never look like a gate that passed.

## Tests
- [ ] (code) with no flags weed judges index plus working tree against HEAD, `--staged` judges the index only, and `--base <ref>` judges the tree against that ref, proven on a temp repo carrying a distinct change in each zone · tests/check_scopes.rs
- [ ] (code) exit 0 on a clean diff and on warnings only, 2 with at least one block-level result, 3 outside a git repository, on an unknown ref, and on a malformed `weed.toml`, each with one stderr line naming the cause · tests/check_exit.rs
- [ ] (code) SARIF on stdout when it is not a terminal, a table when it is, and `--format` overrides both · tests/check_format.rs
- [ ] (code) G1 fires at block level on conflict markers at line start (`<<<<<<<`, `=======`, `>>>>>>>`) in each of ts, py, rs and go through the real binary, and stays silent on a neighbour that carries `=======` inside a string and a markdown table rule · tests/rule_g1.rs
- [ ] (code) `weed rules` prints every rule with id, default level, face and one-line finding, and the levels match `Config::default()` · tests/rules_catalogue.rs
- [ ] (code) `--strict` reports a suppressed block finding at its original level and exits 2, while without `--strict` the same diff exits 0 with the finding as a note · tests/check_strict.rs
- [ ] (code) `examples/pleach/plan.json` declares `"accept": { "smoke": "weed check --strict" }` and passes `pleach validate`; `docs/pleach.md` explains that weed sees the staged files plus the tree against HEAD, so no base argument is needed · scripts/check/pleach-example.sh
