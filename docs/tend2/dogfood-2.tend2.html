# dogfood-2 — the second round of issues from using weeder on real repositories
**Goal.** The garden's repositories ran 0.3.0 and filed what it got wrong. Each item below was reproduced on the released 0.3.0 on 2026-11-05 (`.context/triage-2026-11-05.md` holds the commands and outputs). Four are false blocks, the costliest kind, since each one stops an honest commit and teaches an agent to write an allowance: X1 on an English sentence under a name with TOKEN in it (#93), S1 on code that imports or tests for a NotImplemented error (#94), S1 reading TypeScript's `todo !== null` as Rust's `todo!` (#95), and T1 reporting a test turned `.skip` as a test that disappeared, beside the T3 that is right (#74). Four are blocking rules missing what they exist for: X1 is blind to secrets in env, YAML and TOML files (#90), C1 guards only a section titled hard limits (#77), `check` says nothing about the bash it cannot read (#79), and S2 misses a one-line empty catch (#75). Four cost every agent context at the moment it is refused: a refused commit prints its findings twice (#78, #88), identical findings repeat their whole why and next (#83), T8 lists 235 tests as hidden by a `setupFiles` line (#96), and T5's next names no way through (#89). And no repository but weeder can keep its own fixtures out of the rules (#85), designed in #99.

- 2026-11-05 shaped from the issues filed between 0.3.0 and today, triaged by reproducing each on the release. Left for a later round: R1 and R2 misreads in `scan`, which never blocks (#70, #71, #76, #82, #86, partly answered by `[[overrides]]` here), T4 pairing the wrong lines inside a new `describe` (#97), and M1 matching a double by its short name (#98). Bash as a fifth judged language (#79) is larger than this round; the note in check 10 makes the gap visible meanwhile. PR #87 was closed: it claimed #85 and changed one line of the npm wrapper into a syntax error
