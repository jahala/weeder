# bite — the test must fail without the change
**Goal.** The one dynamic rule. Given `--test "<command>"` and a base, `weed bite` checks out the test commit alone on the base in a temp worktree and runs the command: it must fail. Then it applies the implementation and runs again: it must pass. A test that passes without the change is theater, reported at block level as B1 with the names of the tests that passed. Premise: pleach commits the test phase separately from the implementation, which its umbrella loop carries as a check.

```
weed bite --test "<command>" [--base <ref>] [--test-commit <ref>] [--impl-commit <ref>] [--timeout <secs>]
```

Without explicit commits, bite reads the two most recent commits above the base and expects the earlier to be the test phase. The command runs through the exec seam with a timeout; a hang is exit 3 with the timeout named.

## Kill criterion

If fewer than 90 percent of pleach's phased nodes in the proof repository yield a clean test commit that bite can apply alone, bite is reported and left unshipped: `docs/bite-2026-09.md` records the count and the reasons, and the subcommand stays out of the release.

## Tests
- [ ] (code) on a fixture with a test commit and an implementation commit, bite passes when the test fails alone and passes with the implementation, and reports B1 at block level naming the passing tests when the test passes alone · tests/bite.rs
- [ ] (code) a test command that hangs is exit 3 with the timeout named, and the temp worktree is removed on every path · tests/bite_exec.rs
- [ ] (code) the proof-repo measurement in `docs/bite-2026-09.md` shows at least 90 percent of phased nodes yield a clean test commit, or the file records the kill and `bite` is absent from `weed --help` · scripts/check/bite-kill.sh
