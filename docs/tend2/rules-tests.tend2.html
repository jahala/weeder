# rules-tests — how a test suite gets quietly weaker
**Goal.** The rules that read the change to a test suite and name each way it can become weaker without anyone deleting a test: assertions dropped, a tolerance widened, expected values regenerated, an error assertion loosened, a test uncollected by rename, and a mock placed over the very unit under change. T2 blocks by default; the rest warn, for the human at the pull request. Each lands as a failing fixture first in TypeScript/JavaScript, Python, Rust and Go, with a silent neighbour.

## The rules

| Id | Finding | Default | Detection |
|---|---|---|---|
| T2 | assertions dropped in a changed test file with no allowance | block | assertion count HEAD against tree per test file: `expect(`, `assert`, `assert.*`, `should`, `assert_eq!`, `assert_ne!`, `assert!`, `t.Error`, `t.Fatal`, `require.`, `assert.` (testify), `self.assert*` |
| T4 | tolerance widened: a numeric literal in an approximate assertion or a timeout increased | warn | paired removed/added lines within a hunk, the same assertion shape with a larger number: `toBeCloseTo`, `approx`, `pytest.approx`, `abs_diff`, `assert!((a - b).abs() < x)`, `math.Abs`, `timeout`, `setTimeout`, `time.sleep`, `Duration::from_` |
| T5 | expected values regenerated: snapshot, golden or fixture files changed alongside production code | warn | `__snapshots__/`, `*.snap`, `testdata/`, `golden/`, `fixtures/`, `*.golden`, `*.approved.*` changed in a diff that also changes a prod file |
| T6 | error assertion weakened: a specific message or type became any error | warn | paired lines: `toThrow('x')` → `toThrow()`, `pytest.raises(X, match=)` → `pytest.raises(Exception)`, `assert_eq!(err, X)` → `is_err()`, `errors.Is(err, X)` → `err != nil` |
| T7 | test uncollected by rename: a test file or case renamed so the runner no longer collects it | block | rename detection plus naming conventions: `*.test.ts`/`*.spec.ts`, `test_*.py`/`*_test.py`, `#[test]` kept, `*_test.go` and `TestXxx` |
| M1 | mock over the unit under change: a test in the diff mocks a module whose production file is also in the diff | warn | mock specifiers (`vi.mock`, `jest.mock`, `unittest.mock.patch`, `mockall`, `gomock`) resolved against the diff's prod paths through the reader's import resolution |

tend2's `src/verify/mock.ts` (in `/Users/jahala/conductor/workspaces/feature-map/missoula/`) is prior art for M1 on TypeScript: read it for the shapes it catches, do not port it.

## Tests
- [ ] (code) T2 fires at block level when a changed test file's assertion count drops, per language, and stays silent when assertions move between cases with the count unchanged or a `Weed-allow: T2` trailer carries a reason · tests/rule_t2.rs
- [ ] (code) T4 warns when a paired removed/added line widens an approximate assertion or a timeout, per language, and stays silent when the number tightens or an unrelated literal changes · tests/rule_t4.rs
- [ ] (code) T5 warns when a snapshot, golden or fixture file changes alongside a prod file, and stays silent when only the snapshot changes or only prod changes · tests/rule_t5.rs
- [ ] (code) T6 warns on each weakened error assertion shape per language and stays silent when the assertion becomes more specific · tests/rule_t6.rs
- [ ] (code) T7 fires at block level when a rename takes a test file or case out of the runner's naming convention, per language, and stays silent on a rename that stays inside it · tests/rule_t7.rs
- [ ] (code) M1 warns when a test in the diff mocks a module whose prod file is also in the diff, per language, and stays silent when the mocked module is outside the diff · tests/rule_m1.rs
