# hidden-tests — a test hidden from the runner by configuration
**Goal.** A test file left in the tree and taken out of the run by a configuration line is the shape T7 already names, an uncollected test that still looks present, reached through configuration instead of a rename. weeder gains a check rule, T8, that blocks the line which hides an existing test, and a scan rule, R5, that names every test file the configuration never collects, both fed by one collector that reads the runner configuration the tree carries by kind and name and never by product. The owner's issue 10 states the shapes and the landing order, and it was filed from a tree where two `conftest.py` files hid forty test files, roughly 284 failing tests, behind a run that reported 406 passed, while `weeder check --staged --strict` said nothing.

## The shapes

python: `collect_ignore` and `collect_ignore_glob` in a `conftest.py`; `--ignore`, `--ignore-glob` or `--deselect` in `addopts`; a `testpaths`, `python_files` or `norecursedirs` that no longer reaches a file, in `pyproject.toml`, `pytest.ini`, `setup.cfg` or `tox.ini`. ts/js: `testPathIgnorePatterns` or a narrowed `testMatch` or `testRegex` in a jest config or the `jest` key of `package.json`; `exclude` or a narrowed `include` in a vitest config; `ignore` or a narrowed `spec` in a mocha config; a `test` script in `package.json` narrowed to a directory the suite does not all live in. rust: `autotests = false`, a `[[test]]` table whose `path` points elsewhere or whose `required-features` nobody enables, a leading `#![cfg(...)]` in a file under `tests/`. go: a `//go:build` constraint on a `_test.go` file that an ordinary `go test` never satisfies. A marker inside a test is T3 and stays there; these rules read the configuration around the tests. A `collect_ignore` written as a list literal is read; one that is computed is reported as unreadable, and under `--strict` that is exit 3 rather than a guess. `--deselect` of a single case is T8 at warn, since the file still runs. A narrowed `testpaths` reports once per hidden file, so the SARIF per-path aggregation stays honest, and the message may name the directory.

## The messages

T8, block by default where the line names a file the tree holds or a glob that matches one, warn where it narrows a pattern and the hidden set is computed rather than named: `tests/unit/test_val_bpb.py was taken out of the run by tests/unit/conftest.py:15 (collect_ignore). the file still looks present and no longer runs. delete the test, or write why it is ignored in a Weeder-allow trailer.` R5, on by default in `scan`, one finding per hidden file, the tree-state twin, so a repository that arrived with the exclusion is still told.
