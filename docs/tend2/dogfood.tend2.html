# dogfood — what using weeder on real repositories found, fixed before 0.3.0 ships
**Goal.** weeder runs on its own repository and on the garden's, and every problem that use finds is filed as an issue on jahala/weeder. The first round, 2026-10-26, filed eight against 0.2.4 and the 0.3.0 build. One is a false block: X1 refuses `const prevToken = process.env.ANTHROPIC_AUTH_TOKEN`, which is the safe form X1's own advice asks for (#62). One refused weeder's own release: pre-push judged a tag on a published commit as the whole history under no law (#69). The rest cost every agent context or attention. Through a pipe `check` writes the full rule catalogue for nothing found (#66). T3 and S1 teach a line marker no hook honours (#68). T5 calls a test double a regenerated expectation (#65, and #32 on a fixture the same change adds). R1 cannot read a path written from the source root, a brace pattern, or a name that lives outside the tree on purpose (#63, #64). And `guard install` guards one worktree of several and says nothing (#67). 0.3.0 is tagged once these land.

## Tests
- [x] (code) a tag pushed on a commit the remote already has passes pre-push, under the guard, in a repository whose law sets specimens aside (#69) · tests/guard_push.rs @48bba53 · by cli
- [x] (code) X1 reports a key-like name only where its value is a literal: a read of the environment (`process.env.X`, `os.environ[...]`, `os.getenv`, `env::var`, `os.Getenv`) assigned to a key-like name is silent in ts, py, rs and go, and a high-entropy literal assigned to the same name still blocks (#62) · tests/rule_x1.rs @7793452 · by cli
- [x] (code) a SARIF log declares in `tool.driver.rules` only the rules its results and suppressions name, `ruleIndex` points into that list, an empty log declares none, the log still validates against the vendored schema, and `docs/sarif.md` says so (#66) · tests/sarif_shape.rs @63bf8b6 · by cli
- [x] (code) every block-level check rule's next action names the `Weeder-allow:` trailer, which every face reads, and none teaches the line marker as the way through (#68) · tests/rule_messages.rs @8378eeb · by cli
- [x] (code) T5 is silent on a fixture the same change adds, and on a test double, a file under a fixture directory the tests run rather than compare against (an executable or a script with a shebang), in ts, py, rs and go, and still warns on a changed snapshot or golden beside changed code (#65, #32) · tests/rule_t5.rs @9a9ea6e · by cli
- [x] (code) R1 resolves a cited path that is the tail of exactly one tracked path, reports an ambiguous tail by the paths it could mean, resolves a brace pattern when every expansion exists and reports the expansions that do not (#63) · tests/rule_r1.rs @eed6d5d · by cli
- [x] (code) `[docs] external` in `weeder.toml` names paths, file names and environment variables that live outside the tree on purpose, R1 never reports them, `docs/rules.md` lists the key, and a name not listed is still reported (#64) · tests/rule_r1.rs @c3304ab · by cli
- [x] (code) `guard install` with no `--hooks-dir` writes its hooks under the repository's common git directory and points `core.hooksPath` at it by absolute path, so every worktree is guarded by one install; `guard status` is live in a second worktree; an install already at `.githooks` keeps its directory; README and SKILL.md say so (#67) · tests/guard_install.rs @1a31566 · by cli

## Tried
- 2026-10-26 shaped from the issues the first round of dogfooding filed. Left out: the first push of a repository whose history no remote has seen is still judged whole, under the law of an empty base, so a repository whose own specimens are dishonest on purpose cannot make its first push through the guard. The law loop's ruling makes that the price of a law that lands before the work leaning on it, and no one has hit it on a real first push yet
