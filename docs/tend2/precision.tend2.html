# precision — weeder refuses only what it should, and says what to do next
**Goal.** A false block costs a retry and teaches agents to add allowances, and a gate that says nothing useful at the moment it refuses teaches the same. Each item here was reproduced on 2026-09-23 (`docs/reviews/2026-09-23-repo-audit.md`). Three `assert` lines turned into one `pytest.mark.parametrize` case over the same inputs block on T2, because T2 counts assertion sites rather than the cases they run (issue #31). R1 reads `[AGENTS.md](./AGENTS.md)` as the missing path ``AGENTS.md](./AGENTS.md``, so every relative markdown link is a false warning (issue #38). The table, which a terminal and every harness hook's refusal carry, prints what was found and drops why it matters and what to do next, although `SKILL.md` promises all three. A mistyped rule id in `[rules]` is taken without a word and changes nothing. `guard install` in a repository with husky or another hooks path switches git away from it and says nothing, so those hooks stop running. The recall section opens with "every rule that blocks" and names six of the twelve that do.

## Tests
- [ ] (code) a test that turns repeated assertions into a parametrized case, or a loop over literal cases, holding the same cases is silent on T2 in ts, py, rs and go, and a parametrized case that drops one of the inputs still blocks · tests/rule_t2.rs
- [ ] (code) R1 resolves the destination of a markdown link, inline or reference-style, and reports a link whose destination is missing by that destination alone · tests/rule_r1.rs
- [ ] (code) every row of `--format table` carries the finding's why and next beside its what, and a harness hook's refusal reason carries them too · tests/sarif_table.rs
- [ ] (code) a `[rules]` key the catalogue does not hold exits 3 and names the key and the nearest rule id · tests/core_config.rs
- [ ] (code) `guard install` where `core.hooksPath` already names another directory refuses with exit 3, names that directory and says how to proceed, and `SKILL.md` names every flag the refusal mentions · tests/guard_install.rs
- [ ] (code) the recall section's opening sentence names exactly the rules `scripts/check/recall-bar.sh` holds to the bar, and both read that list from one place · scripts/check/recall-bar.sh

## Tried
- 2026-09-23 shaped from the repository audit of the same day. Left out as noise rather than friction: T5 warning on a fixture added in the same change (a warning, issue #32), and the SPECIMEN notes `scan` writes once per fixture path. Whether the recall bar should cover every rule that blocks, which would put D2 in Go (55 percent) under it, is the owner's call and is not this loop's; this loop makes the sentence true of the bar that exists
