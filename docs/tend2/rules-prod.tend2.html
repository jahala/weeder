# rules-prod — the shapes production code should not grow
**Goal.** The rest of the check catalogue: swallowed errors, debug leftovers, dependency manifest changes, dependency-direction violations, out-of-scope files, a broadened ignore, and a large or binary file. D2 and X2 block when configured; the rest warn. Each lands as a failing fixture first in TypeScript/JavaScript, Python, Rust and Go, with a silent neighbour.

## The rules

| Id | Finding | Default | Detection |
|---|---|---|---|
| S2 | swallowed error: an empty `catch`, a bare `except`, `except Exception: pass`, `.catch(() => {})`, `_ = err`, `if err != nil { return nil }` with no logging or wrapping, `unwrap_or_default()` or `.ok()` discarding a fallible call in new code | warn | added lines, language-aware, using the reader's outline for block bodies |
| S3 | debug leftovers in production code: `console.log`, `debugger`, `print(` at module or function level in a non-CLI module, `pdb.set_trace`, `breakpoint()`, `dbg!`, `println!` outside `main.rs` and CLI faces, `fmt.Println` outside `main`, `spew.Dump` | warn | added lines in prod files; a file the config names as a CLI entry is exempt |
| D1 | dependency manifest changed | warn; block when a `[scope]` excludes it | path classification: `package.json`, `Cargo.toml`, `pyproject.toml`, `requirements*.txt`, `go.mod`, and their lockfiles |
| D2 | dependency direction violated: an import crosses a boundary `[deps]` forbids | block | the reader's import resolution on changed files, mapped onto the layers `[deps]` names; weed's own doctrine (core imports nothing from seams or faces) is the shipped example |
| X2 | out of scope: a file touched that no `--scope` glob allows | block when scope given | path match; the finding names the blast radius through the reader's callers of the touched file's definitions |
| C2 | ignore broadened to hide source or tests | warn | added patterns in `.gitignore`, `.eslintignore`, `.prettierignore`, `.dockerignore` that match source or test globs of the repo's languages |
| G2 | large or binary file added | warn | size above 1 MiB, or binary content detection, on added files not already tracked |

## Tried
- 2026-09-05 the catalogue is complete after this loop: eighteen check rules with G1 on check-face; `docs/rules.md` is written here and `weed rules` reads from the same table, so the two cannot drift
- 2026-09-05 S2's Go shape is deliberately narrow (`return nil` after a nil check with nothing else in the block) because Go's idiom makes wider shapes noisy; calibration decides whether it stays a warning
- 2026-09-06 built by pleach node `rules-prod` (claude/opus, codex audit) in one attempt, 65 minutes; the land gate refused the composition with scan (both landings added a `comments` view to the mask, and scan still read the tree as text where rules-prod now reads a blob), resolved by hand. Every detector is a pure function of one `Judgement` the face gathers once: changes, config, scope, tracked paths, callers. D1 warns and blocks when a scope excludes the manifest, and the registry keeps a level a detector chose above its default; D2 resolves a module name by matching its segments against the repository's own paths and refuses to guess between two layers; X2 names the blast radius through the reader's callers; C2 turns an ignore pattern into globs and reports what it hides; G2 reads size and binariness off the same bytes; S3 reads `[entrypoints] cli`; the vendor name the brief listed became the shape `dump`. weed.toml now states weed's own layers, so D2 holds weed to its doctrine
- 2026-09-06 the catalogue is complete: eighteen check rules and four scan rules, `docs/rules.md` written from the same table and pinned to it by `tests/docs_rules.rs`, so every SARIF helpUri lands somewhere
- 2026-09-06 left for calibration: D2 reads every import of a changed file, so touching a file that already reaches the wrong way blocks the change that touched it. Right for a clean tree, wrong for a repository adopting the rule with a mess; whether existing arrows need an allowance is calibration's call. S2's Go shape is narrow on purpose, and calibration decides if it is still too wide
- 2026-09-06 cape-town's specimen ruling (calibration's Tried) lands here as a check rather than in calibration: it is a config surface, and the calibration worker rightly refused to move the numbers it was measuring by changing a detector's input mid-run
