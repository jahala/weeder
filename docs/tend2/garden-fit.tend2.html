# garden-fit — what makes weeder a bed of the garden
**Goal.** The umbrella verifies every bed against a fit contract, F1 to F6. This loop ships what those checks read: `garden.json` at the root; a `SKILL.md` with a one-sentence description; the brand layer at `.brand/products/weeder/` with the name and accent marked flagged; a `LICENSE` (MIT, flagged until the owner confirms); a `README.md`; the release pipeline copied from tilth's (CI, multi-platform binaries, crates.io, an npm wrapper); and the GitHub Action example that is weeder's first distribution, `examples/ci/github.yml`.

## garden.json

Name `weeder`; kind `["gate", "hook"]`; version equal to `Cargo.toml`; install per platform (the npm wrapper, `cargo install weeder`, and the release binaries by target triple); faces (`check`, `scan`, `guard`, `bite`, `hook`, `rules`); check command `weeder check --format sarif`; metric command `bash scripts/check/calibration-bar.sh`; declared context cost `0`. The manifest schema belongs to the contracts repository, which does not exist yet; until it does, `schemas/garden.schema.json` here is the vendored proposal and is flagged as such.

## The brand layer

`.brand/products/weeder/identity.md`, `colors.md`, `voice.md`, `petalsrc.example` and `assets/` in the shape of the umbrella's `.brand/products/pollen/`. Six accents are taken and pollen has claimed a seventh (see the umbrella's `.brand/colors.md`, Product Accents). Propose three candidates measured with the method in the umbrella's `scripts/palette_contrast.py` (WCAG ratios against paper, band, ink and soil-night), record the numbers in `colors.md`, and mark the accent and the name `[flagged]` for the owner. The voice delta carries weeder's terminology: finding, block, warn, note, gate, honest, growth; never violation, error (for a finding), failure (for a block).

## Release pipeline

`.github/workflows/ci.yml` runs `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings`, `cargo test` on push and pull request. `.github/workflows/release.yml` mirrors tilth's: a version check across `Cargo.toml` and `npm/package.json`, a build matrix (x86_64 and aarch64 for linux-musl, macos, windows), crates.io publish, npm publish of the wrapper. `npm/` holds `package.json`, `install.js` and `run.js` in tilth's shape. Nothing here is run against GitHub; `actionlint` proves the workflows parse.
