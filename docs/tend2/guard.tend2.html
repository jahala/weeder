# guard — the law in git
**Goal.** `weeder guard install` puts weeder's judgement where no harness can route around it: git hooks through `core.hooksPath`. Pre-commit runs `weeder check --staged --strict`; pre-push runs `weeder check --strict --base <upstream>` and refuses a non-fast-forward push to a protected branch; pre-rebase refuses rewriting protected history. `guard status` proves each hook is live; `guard uninstall` restores what was there. The only bypass, `--no-verify`, is denied by the harness hook (the hooks loop) and by the bundle the stem generates.

## Shape

```
weeder guard install [--hooks-dir .githooks] [--protect <branch>...]
weeder guard status
weeder guard uninstall
```

`install` writes `.githooks/pre-commit`, `.githooks/pre-push` and `.githooks/pre-rebase` as small POSIX shell scripts that call the `weeder` binary by the absolute path it resolves at install time (with a fallback lookup on `PATH` named in the script so a moved binary is a clear error, not a silent skip), sets `core.hooksPath` to the directory, and records the previous `core.hooksPath` in `.git/weeder/previous-hooks-path` so `uninstall` can restore it. Protected branches come from `weeder.toml` `[guard].protected` and default to the repository's default branch. `status` reports for each hook: present, executable, points at a binary that runs, and `core.hooksPath` set; any miss is named and the exit code is 2.

## What each hook refuses

Pre-commit: any block-level finding in the index. Pre-push: any block-level finding between the upstream and the pushed ref, and any push to a protected branch whose remote ref is not an ancestor of the local ref (a non-fast-forward, including force). Pre-rebase: a rebase that would rewrite a protected branch, whether it is the branch checked out or the one named on the command line. A protected upstream is the ordinary case (rebasing your own branch onto `main`) and is allowed. Each refusal prints the table and one line naming the hook and what to do.

## The trailer stage, commit-msg

An allowance on a guardrail change is a person's act, and the place a person writes it is the commit message: `Weeder-allow: C1 <why>`. Pre-commit runs before the message exists, so it can honour nothing, and under `--strict` a trailer travelling with a range is reported and not honoured either. The ruling of 2026-09-10 (cape-town, after the umbrella's stem was refused planting its own harness files): a human-authorized guardrail change passes by a trailer on the commit, judged at commit-msg, which is the deciding stage for any block-level finding a trailer may allow.

`weeder guard commit-msg <message-file>` judges the index again with the message's trailers honoured. A trailer is honoured where the message travels with the change, at commit-msg and again at pre-push over the pushed commits; an inline `weeder-allow` comment stays what `--strict` makes of it in every hook, reported at its own level, because the line is the agent's to write and the message is the person's. Pre-commit keeps blocking and its refusal names, for each block-level finding, the exact trailer that would allow it, `Weeder-allow: <RULE> <reason>`, and says that commit-msg is where it is read. No path is exempt: a judge that asks the planter about the planter's writes is the stem allowing itself, so harness settings, hooks and workflows written by the umbrella's stem are judged like any other bytes.

`install` writes `.githooks/commit-msg` beside the three, calling `weeder guard commit-msg "$1"`; `status` and `uninstall` know it; C1 recognises its bundle. `garden.json` declares `commit-msg` beside `pre-commit` in `faces.git`, which the umbrella's manifest schema allows as of jahala/plotplot master (`contracts/manifest.schema.json` at 106570d), so the vendored copy moves to that revision and the pin note beside it says so.
