# guard — the law in git
**Goal.** `weed guard install` puts weed's judgement where no harness can route around it: git hooks through `core.hooksPath`. Pre-commit runs `weed check --staged --strict`; pre-push runs `weed check --strict --base <upstream>` and refuses a non-fast-forward push to a protected branch; pre-rebase refuses rewriting protected history. `guard status` proves each hook is live; `guard uninstall` restores what was there. The only bypass, `--no-verify`, is denied by the harness hook (the hooks loop) and by the bundle the stem generates.

## Shape

```
weed guard install [--hooks-dir .githooks] [--protect <branch>...]
weed guard status
weed guard uninstall
```

`install` writes `.githooks/pre-commit`, `.githooks/pre-push` and `.githooks/pre-rebase` as small POSIX shell scripts that call the `weed` binary by the absolute path it resolves at install time (with a fallback lookup on `PATH` named in the script so a moved binary is a clear error, not a silent skip), sets `core.hooksPath` to the directory, and records the previous `core.hooksPath` in `.git/weed/previous-hooks-path` so `uninstall` can restore it. Protected branches come from `weed.toml` `[guard].protected` and default to the repository's default branch. `status` reports for each hook: present, executable, points at a binary that runs, and `core.hooksPath` set; any miss is named and the exit code is 2.

## What each hook refuses

Pre-commit: any block-level finding in the index. Pre-push: any block-level finding between the upstream and the pushed ref, and any push to a protected branch whose remote ref is not an ancestor of the local ref (a non-fast-forward, including force). Pre-rebase: any rebase whose upstream or branch is protected. Each refusal prints the table and one line naming the hook and what to do.
