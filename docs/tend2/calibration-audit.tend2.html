# calibration-audit — the builder does not grade its own calibration
**Goal.** The classification of blocked commits into true positive, acceptable and false positive is the number weed ships on, so it is not the builder's word. A second party on a different provider re-classifies a random sample of at least twenty blocked commits from `docs/calibration-2026-09.md` and at least twenty cases from the recall sample, blind to the first classification, and writes `docs/calibration-audit-2026-09.md`. Agreement at or above 90 percent on each sample stands; below it, the classification is untrusted and redone before anything ships.

## How it is conducted

This loop's pleach node is cast to a provider other than the one that built calibration (`plans/cast.json`), so the party classifying differs from the builder in vendor as well as session. The work order is the sample and the definitions: true positive (the rule fired on the shape it names), acceptable (the shape is there and a maintainer would want to know, even if the commit was right to merge), false positive (the rule fired on something that is not its shape). `scripts/check/calibration-agreement.sh` draws the sample by a seeded shuffle recorded in the audit file, so the sample is reproducible, and computes agreement from the two files.

- [x] (code) agreement between the audit and the original classification is at or above 90 percent on each sample, or the calibration file's first sentence says the classification is untrusted · scripts/check/calibration-agreement.sh @a2425fb · by cli
- [ ] (code) every audit file declares on its own line whether the auditor could read the builder's classification (`Blind: no`, with what it saw, or `Blind: yes`), and `docs/calibration-audit-blind-2026-09.md` carries a blind re-grade on a fresh seed whose blindness is mechanical: a script (`cargo xtask audit-packet`) writes the packet from the pinned corpus as the verbatim `git diff` hunks of each sampled commit plus the rule ids that fired, with no prose from anyone who has read the ledger; a fresh agent session that receives only that packet returns the verdicts; the packet and the response are kept verbatim beside the file; and the evidence script re-derives the packet from git and refuses the audit if a single hunk differs, then checks agreement at or above 90 percent on each sample, or the calibration file's first sentence says the classification is untrusted · scripts/check/calibration-agreement.sh

- 2026-09-05 shaped from cape-town's binding checks; the owner may take the auditor's seat instead of a second provider, and the script does not care which
- 2026-09-06 conductor: the pleach running these nodes stages every path the Write and Edit tools touched, wherever it is. A path outside this worktree (under `$TMPDIR` or `/tmp`) makes the collector ask git about a file it cannot see, which kills the delivery and removes the worktree (dogfood P8, P11); `.loop-scratch/` is collected and judged by the hygiene gate (P10). So: never use the Write or Edit tool outside this worktree; write scratch outside it only through the shell; leave `.loop-scratch/` empty before you finish; and never leave a credential-shaped string, even a quoted one, in a file that will be collected
- 2026-09-06 built by pleach node `calibration-audit` (codex worker, claude audit), both checks stamped, landed through `pleach land`. `docs/calibration-audit-2026-09.md` re-grades twenty blocked commits and twenty recall cases drawn by SHA-256 over a seed, and agrees with the builder's classification on every one of both samples; `scripts/check/calibration-agreement.sh` redraws the sample and recomputes the agreement. Total agreement is a strong result and a reason to look at the draw: the sample comes from the calibration file's own tables, where the builder's class sits beside the commit, so the auditor could read it before judging. A later audit should hand the auditor the diffs and nothing else
- 2026-09-06 cape-town, on the anchoring caveat: the unqualified verdict stands today on the sighted audit, and a blind one is what makes it stand tomorrow. Shaped above: the auditor receives diffs and rule ids only, never the class, on a fresh seed, same 90 percent bar, and every audit file says which kind it is so the report can read it
- 2026-09-06 the first blind run (codex, node/calibration-audit) came back forty of forty and is refused unlanded: its packet's `diff` blocks were not diffs but sentences the same worker wrote after reading the ledger (`+ The command surface consolidated file listing into the list tool.`), which is the builder's reasoning handed to the auditor in a code fence. The check is reworded so blindness is a property a script can refuse: verbatim git hunks from the pinned corpus, a fresh session, and the packet re-derived at verify time
