# calibration-audit — the builder does not grade its own calibration
**Goal.** The classification of blocked commits into true positive, acceptable and false positive is the number weed ships on, so it is not the builder's word. A second party on a different provider re-classifies a random sample of at least twenty blocked commits from `docs/calibration-2026-09.md` and at least twenty cases from the recall sample, blind to the first classification, and writes `docs/calibration-audit-2026-09.md`. Agreement at or above 90 percent on each sample stands; below it, the classification is untrusted and redone before anything ships.

## How it is conducted

This loop's pleach node is cast to a provider other than the one that built calibration (`plans/cast.json`), so the party classifying differs from the builder in vendor as well as session. The work order is the sample and the definitions: true positive (the rule fired on the shape it names), acceptable (the shape is there and a maintainer would want to know, even if the commit was right to merge), false positive (the rule fired on something that is not its shape). `scripts/check/calibration-agreement.sh` draws the sample by a seeded shuffle recorded in the audit file, so the sample is reproducible, and computes agreement from the two files.

## Tests
- [ ] (code) `docs/calibration-audit-2026-09.md` carries an independent re-classification of a seeded random sample of at least twenty blocked commits and at least twenty recall cases, each with the auditor's verdict and one line of reasoning, and names the provider that produced it · scripts/check/calibration-agreement.sh
- [ ] (code) agreement between the audit and the original classification is at or above 90 percent on each sample, or the calibration file's first sentence says the classification is untrusted · scripts/check/calibration-agreement.sh
