# core — the pure model of a diff
**Goal.** A crate whose core does no I/O and never panics on input: `parse_diff` turns unified diff text into hunks with old and new line numbers; `classify_file` names a path's kind and language; `Finding` is the one shape every rule produces; `weeder.toml` parses into a typed config with defaults that ship in the binary; suppressions parse from commit trailers and inline comments. Everything a rule needs is a value handed in, so a rule is a function from data to findings.

## Shapes

`parse_diff(&str) -> Result<Vec<FileDiff>, DiffError>`. A `FileDiff` carries old and new paths (renames and copies keep both), a change kind (added, deleted, modified, renamed, binary, mode-only), and hunks. A hunk carries its header ranges and lines; each line is context, added or removed, with the line number in the old file, the new file, or both. Git's `\ No newline at end of file` marker, empty files, and diffs with several hunks per file are ordinary inputs, not edge cases.

`classify_file(path, content) -> Classification { kind, lang, has_inline_tests }`. A Rust production file with a `#[cfg(test)]` module stays `prod` and sets `has_inline_tests`; rules that count or read tests look there, so a stub added to such a file is still a stub in production code. Kinds: `test` (by path convention and the reader's test-file signal), `prod`, `config`, `manifest` (`package.json`, `Cargo.toml`, `pyproject.toml`, `go.mod`, lockfiles), `generated` (lockfiles, minified bundles, files with a generated-by header), `guardrail` (`.github/workflows/*`, `.claude/settings*.json`, `.gemini/settings.json`, `.codex/*`, `weeder.toml`, `.githooks/*`, and the hard-limits section of `AGENTS.md` or `CLAUDE.md`). Languages for v1: TypeScript/JavaScript, Python, Rust, Go; anything else is `Lang::Other` and rules that need a language stay silent on it.

`Finding { rule, level, path, region, message: { what, why, next }, fix: Option<Fix>, suppressed: Option<Suppression> }`. Levels: `Block`, `Warn`, `Note`. A suppressed finding keeps its rule and region and becomes a `Note` carrying the reason, so the pile stays visible.

`Config` from `weeder.toml`: per rule `off | warn | block` for check rules and `off | on` for scan rules; `[scope] allow` with the globs a change may touch; `[deps] layers` mapping a layer name to its path globs and `[deps] allow` listing the permitted `{ from, to }` directions between them (a direction naming an undefined layer is an error); `[thresholds]` with `todo_age_days` and `dependency_lag`; `[guard] protected` with the branches guard defends. One spelling per key. Unknown keys and invalid levels are errors in the return type with the key named. `Config::default()` is the catalogue's defaults and is what `weeder rules` prints.

Suppressions: a commit trailer `Weed-allow: T2 <reason>` or an inline `weed-allow T2: <reason>` on an added line or the line above. Both need a reason; a bare id is not a suppression and is reported as such.
