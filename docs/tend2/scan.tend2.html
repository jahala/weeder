# scan — the tree judged, never blocked
**Goal.** `weed scan` reads the repository as it is, not a diff, and names repo-state hygiene: a path, command, flag or symbol cited in the docs that no longer exists; a public symbol nothing references; a TODO older than the configured age; a dependency pin far behind the registry. It never blocks: exit 0 or 3 only, findings at warning level. tend2's hygiene loop is its first consumer, citing `weed scan --format sarif` as evidence; `docs/tend2-seam.md` is the proposal for that seam.

## The rules

| Id | Finding | Detection |
|---|---|---|
| R1 | a path, command, flag or symbol cited in `CLAUDE.md`, `AGENTS.md`, `README.md` or `docs/**/*.md` no longer exists | markdown code spans and bare paths: a span with a `/` or a file extension resolves against the tree; a span that is a CLI command resolves its subcommand against `weed --help`-style listings the config names; a span that is an identifier resolves against the reader's symbols |
| R2 | dead export: a public symbol with no reference anywhere in the repository | the reader's outline for exported definitions, then callers across the scope; entry points (`main`, `lib.rs` root exports, `index.ts` re-exports, `__init__` names, `TestXxx`) are exempt |
| R3 | a TODO older than the configured age | `git blame` on lines carrying `TODO`, `FIXME` or `XXX`, compared with `[thresholds].todo_age_days` (default 30) |
| R4 | dependency lag: a manifest pin more than `[thresholds].dependency_lag` (default 3 minor versions) behind the registry's latest | manifest parse for `package.json`, `Cargo.toml`, `pyproject.toml`, `go.mod`, checked against a committed snapshot `.weed/registry-snapshot.json` when there is no network; `weed scan --refresh-snapshot` writes it from the registries when there is |

```
weed scan [--rules <ids>] [--format sarif|table] [--refresh-snapshot]
```

Keep-your-place applies: a scan rule that names no hot spot confirmed by a later loop in a season is demoted to off by default. That is a decision for a later loop, recorded here so the rule set is known to be provisional.
