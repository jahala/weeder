# authoring — a new rule cannot be half-added
**Goal.** A rule is one pure function in one file, and the suite already fails when a rule lacks fixtures, docs or a detector entry. Two gaps are left, found on 2026-09-23 (`docs/reviews/2026-09-23-repo-audit.md`). Every detector writes its own level into each finding, and `reported_at` (`src/core/rules/mod.rs`) applies the configured level only where that equals the catalogue default, so a detector that writes the wrong level takes the rule out of `[rules]` without a word. The recall campaign's rule list is typed by hand (`xtask/src/mutate/inject.rs`), so a rule nobody adds there is never measured, and nothing fails. And the six places a new rule touches are written down nowhere.

## Tests
- [x] (code) a detector's finding carries the catalogue's level unless the detector names a rule-specific level as an override the type spells out; for every check rule, a fire fixture run under `[rules] <id> = "warn"` reports nothing at error level, and under `"off"` reports nothing from that rule · tests/config_levels.rs @d502bd0 · by cli
- [x] (code) the recall campaign injects for every check rule the catalogue holds, read from the catalogue, and a check rule with no injector fails `cargo test --workspace` · scripts/check/recall-rules.sh @e3dca6c · by cli
- [x] (code) `docs/adding-a-rule.md` walks one rule through every file it touches, from the catalogue row to the recall injector, `CONTRIBUTING.md` points at it, and `weeder scan` reports no R1 finding on it · scripts/check/adding-a-rule.sh @d8ca99e · by cli

## Tried
- 2026-09-23 shaped from the repository audit of the same day. Left out: moving the shared helpers (`collect.rs`, `vocab.rs`, `idiom.rs`, `generated.rs`) out of `src/core/rules/check/`, which would read better and fixes nothing
- 2026-09-23 built by an opus worker in its own worktree. The trap test caught D1 and C3 before the fix: both blocked under `[rules] = "warn"`. The owner's ruling on levels, written by the conductor: with no `[rules]` entry a detector's override stands (D1 louder, R1 quieter); an explicit `block` or `warn` caps every finding of the rule, override included; `off` silences it. `Config.rules` now holds only what the repository wrote, so an entry equal to the default is told apart from no entry. c2's evidence was first named as the source file that holds the test, which no runner can run; `scripts/check/recall-rules.sh` runs that one test by name and refuses a filter that matched nothing
