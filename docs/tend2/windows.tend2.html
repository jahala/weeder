# windows — weeder builds and guards on x86_64-pc-windows-msvc
**Goal.** The release contract names five platforms and v0.1.0 shipped four: the `x86_64-pc-windows-msvc` leg of the release run failed to compile, and `publish-crate` and `publish-npm` were skipped behind it (issue #30, run 34405728874). weeder's library imports `std::os::unix::fs::PermissionsExt` with no platform gate in `src/seams/fs.rs`, for the two helpers `guard` uses to install a hook and to say whether git will run it, and CI builds on ubuntu alone, so the tag was the first time anything compiled for Windows. This loop makes Windows a platform weeder is held to on every pull request, not a leg that fails at the tag.

## What the helpers mean on Windows

Git settles it, not us. NTFS keeps no mode bits, and Git for Windows strips `X_OK` from its `access` check before it looks for a hook, so any hook file that exists is a hook git runs, through the `sh` Git for Windows ships, which reads the `#!/bin/sh` line `weeder guard install` writes. `is_executable` there asks whether a file is there; `make_executable` has nothing to write and says so. The reason is written beside each gate, and the unix half keeps the mode bits it has, because a hook git cannot execute on unix is a hook git walks past without a word.

The tests carry the same shape: a test that sets or reads a mode, or creates a symlink, is a unix test and is gated as one with a line beside the gate saying what Windows lacks, and a test with a Windows meaning of its own (a hook file that exists is installed and runs) is written for Windows rather than skipped there. `bite` runs a test command through `sh`; it is unshipped and its tests may be unix until it ships.
