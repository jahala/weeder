# weeder — the judge of the diff
**Goal.** A static Rust binary that reads what an agent produced and refuses the growth that should not be there, deleted or weakened tests, skips, stubs, swallowed errors, secrets, guardrail edits, dependency-direction violations, in milliseconds, with zero tokens, every finding as SARIF 2.1.0. `weeder check` judges a diff and may block; `weeder scan` judges the tree and never blocks; `weeder guard` is the law in git through hooks; `weeder bite` proves a test fails without its change. For maintainers drowning in agent-authored pull requests who need a deterministic gate before they read, for teams running agents on several harnesses who want one law, and for the garden's own fleets through pleach.

## One core, three faces

The core is pure: `parse_diff` turns a unified diff into hunks; `classify_file` names a file's kind (test, prod, config, manifest, generated, guardrail) and language; `rules` map hunks or a tree plus a context to findings; `sarif::render` turns findings into a log. No I/O in core, failure in return types. Seams do the I/O, git, a command with a timeout, the filesystem, and the reader that wraps `tilth-core` for outlines, test-file classification, imports and callers, and are injected by the faces. The faces are the CLI subcommands. This is the same doctrine pleach follows, and weeder's own D2 rule enforces it on weeder.

Exit codes are the contract every consumer reads: 0 clean or warnings only, 2 at least one block-level result, 3 weeder could not run. A gate that cannot run fails closed, so 3 is a failure to pleach and the message says so.

## Only the unambiguous blocks

A false block costs a retry, and agents learn to add allowances. So a deleted test, an added skip, a stub in production code, a secret, an edited guardrail file, and a conflict marker block; everything else warns, and warnings are for the human at the pull request. Calibration on real history decides whether weeder ships at all, and the kill bar is written before the first rule: if reaching under two percent block-level false positives per repo needs T1, T2, T3 or S1 disabled, the deterministic core is too thin to be a gate, and the calibration file says so in its first sentence.

## Where the pieces are

Modules live on the children. [tilth-core](tilth-core.tend2.html) is the parsing substrate and the reader seam. [core](core.tend2.html) is the pure diff model, classification, config and suppressions. [sarif](sarif.tend2.html) is the output. [check-face](check-face.tend2.html) is the CLI, the git seam, exit codes and the first end-to-end rule. [rules-block](rules-block.tend2.html), [rules-tests](rules-tests.tend2.html) and [rules-prod](rules-prod.tend2.html) carry the catalogue. [guard](guard.tend2.html) is the git-hook law, [hooks](hooks.tend2.html) the harness hooks, [scan](scan.tend2.html) the tree face, [hardening](hardening.tend2.html) determinism and never-panic, [calibration](calibration.tend2.html) the verdict, [recall](recall.tend2.html) the mirror measurement by mutation injection, [calibration-audit](calibration-audit.tend2.html) the second party's classification, [bite](bite.tend2.html) the dynamic rule, and [garden-fit](garden-fit.tend2.html) the manifest, skill, brand layer, license and release pipeline the umbrella verifies.
