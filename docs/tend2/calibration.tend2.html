# calibration — does the gate deserve to exist
**Goal.** Before weed is allowed to block anyone, it runs over real history: `weed check --base <parent> --strict` on up to the last 200 commits of the default branch in tilth, pleach, tend2, copeca and umbel. `docs/calibration-2026-09.md` records per repo the commits judged, blocked and warned, and classifies every blocked commit as true positive, acceptable, or false positive. The ship bar is block-level false positives under two percent of the pooled commits across the five repos, with per-repo counts shown; a repo with fewer than 50 commits is reported, not judged alone. The kill bar is reaching that bar only by disabling T1, T2, T3 or S1; then the verdict is written in the file's first sentence and weed does not ship as a gate. The metric command `garden.json` names is this measurement.

## Repos

| Repo | Path | Default branch |
|---|---|---|
| tilth | `/Users/jahala/CascadeProjects/tilth` | `main` |
| pleach | `/Users/jahala/conductor/workspaces/pleach-v1/cayenne` | its default branch |
| tend2 | `/Users/jahala/conductor/workspaces/feature-map/missoula` | its default branch |
| copeca | `/Users/jahala/conductor/workspaces/copeca/cancun` | its default branch |
| umbel | `/Users/jahala/conductor/workspaces/rctrl/master` | `master` |

A repo with fewer than 200 commits contributes every commit it has, and the file says so. The run never writes to those repositories: it reads them through `git` with `--base <parent>` against a detached worktree it creates under a temp dir and removes.

## The file

`docs/calibration-2026-09.md` opens with the verdict sentence: ship, or kill with the rules that would have to go. Then one table per repo (commit, rules fired at block level, classification, one line of reasoning), then totals, then the rule-level view: for each block rule, fires, true positives, false positives, and the false-positive share. Classification is a judgement written by whoever runs the calibration; the script checks the arithmetic and the bar, never the judgement.

- 2026-09-05 repos follow the umbrella loop's list; the brief's rctrl is umbel's former name and the same repository
- 2026-09-05 `xtask` over a script so the calibration runs the same core the binary ships, with no second implementation of the diff walk

- 2026-09-05 cape-town: track the suppression rate from the day guard is installed and report it beside precision; rising suppressions with flat true positives means the gate is gamed or mis-tuned. The recall section of the same file belongs to the recall loop, and the second party's classification to calibration-audit
- 2026-09-05 cape-town's ruling on specimens: `weed.toml` may exclude paths only under `fixtures/adversarial/**` (and the specimen directories a repo names), every excluded path is still reported at note level in the SARIF so an exclusion is as visible as an allowance, and it is a list of directories, never a rule toggle. This is what lets `weed check` on weed's own tree report nothing at block level, and it lands with calibration
- 2026-09-06 built by pleach node `calibration` (claude/opus) in 55 minutes with all four checks stamped, then lost at pleach's staging step over two scratch files (dogfood P8) and recovered by replaying every write and edit in the worker's transcript at the base commit; tend2 verify stamped all four again on the recovered tree before it was merged. The verdict: weed ships as a gate, 1.42 percent pooled block-level false positives over 635 commits in five repositories, 71 blocked, 7 true positives, 55 acceptable, 9 false positives, T1 T2 T3 S1 all at block level. The worker's own notes are in docs/dogfood/calibration.md
- 2026-09-06 the corpus names the five repositories by local checkout path, which the loop's narrative asked for and AGENTS.md forbids: the report reproduces on this machine only, and it changes whenever any of those checkouts moves. Shaped above as a check that pins each repository by source and tip sha, and the loop now needs rules-block too, so the recalibration counts the three rule fixes calibration found. The specimen ruling is on rules-prod; the C1 friction (42 of 71 blocks are real workflow edits) is a product question put to cape-town
