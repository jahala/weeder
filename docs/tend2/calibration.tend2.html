# calibration — does the gate deserve to exist
**Goal.** Before weeder is allowed to block anyone, it runs over real history: `weeder check --base <parent> --strict` on up to the last 200 commits of the default branch in tilth, pleach, tend2, copeca and umbel. `docs/calibration-2026-09.md` records per repo the commits judged, blocked and warned, and classifies every blocked commit as true positive, acceptable, or false positive. The ship bar is block-level false positives under two percent of the pooled commits across the five repos, with per-repo counts shown; a repo with fewer than 50 commits is reported, not judged alone. The kill bar is reaching that bar only by disabling T1, T2, T3 or S1; then the verdict is written in the file's first sentence and weeder does not ship as a gate. The metric command `garden.json` names is this measurement.

## Repos

| Repo | Path | Default branch |
|---|---|---|
| tilth | `https://github.com/jahala/tilth.git` | `main` |
| pleach | `https://github.com/jahala/pleach.git` | its default branch |
| tend2 | `https://github.com/jahala/tend.git` | its default branch |
| copeca | `https://github.com/jahala/copeca.git` | its default branch |
| umbel | `https://github.com/jahala/umbel.git` | `master` |

A repo with fewer than 200 commits contributes every commit it has, and the file says so. The run never writes to those repositories: it reads them through `git` with `--base <parent>` against a detached worktree it creates under a temp dir and removes.

## The file

`docs/calibration-2026-09.md` opens with the verdict sentence: ship, or kill with the rules that would have to go. Then one table per repo (commit, rules fired at block level, classification, one line of reasoning), then totals, then the rule-level view: for each block rule, fires, true positives, false positives, and the false-positive share. Classification is a judgement written by whoever runs the calibration; the script checks the arithmetic and the bar, never the judgement.
