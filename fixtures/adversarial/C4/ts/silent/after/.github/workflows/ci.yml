name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Test
        run: |
          rm -rf coverage || true
          npm test
      - name: Lint
        run: npm run lint
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache
          key: deps
      - name: Upload coverage
        continue-on-error: true
        if: false
        run: ./scripts/upload-coverage.sh
      - name: Flaky suite
        continue-on-error: true
        run: npm test
