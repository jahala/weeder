name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - uses: actions/cache@v4
        with:
          path: ~/.cache
          key: deps
      - name: Upload coverage
        run: ./scripts/upload-coverage.sh
