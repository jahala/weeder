name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e .
      - name: Test
        run: |
          rm -rf coverage || true
          pytest
      - name: Lint
        run: ruff check .
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache
          key: deps
      - name: Upload coverage
        continue-on-error: true
        if: false
        run: ./scripts/upload-coverage.sh
      - run: pytest
        continue-on-error: true
