name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: cargo fetch
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo fmt --check
