# weeder's own doctrine, written as this repository states it: core computes,
# seams reach the world, faces put the two together. The arrows run one way.
[deps]
layers = { core = ["src/core/**"], seams = ["src/seams/**"], faces = ["src/faces/**"] }
allow = [
    { from = "faces", to = "core" },
    { from = "faces", to = "seams" },
    { from = "seams", to = "core" },
]
