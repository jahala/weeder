# weeder on a pull request.
#
# Copy this to .github/workflows/weeder.yml in your own repository. It judges the
# pull request against the branch it is opening onto and leaves its verdict as
# one comment on the pull request, written on the first run and edited in place
# on every push after.
#
# The job fails when weeder blocks: `weeder check` leaves with 2 for a block-level
# finding, 0 for a clean run or warnings only, and 3 when it could not run at
# all. The comment is written first either way, because the run that blocked is
# exactly the one whose findings a reviewer needs to see. On a pull request from
# a fork GitHub gives the job no right to write, so the same text goes to the
# job summary instead, and the exit code still decides the job.

name: weeder

on:
  pull_request:

permissions:
  contents: read

# A newer push cancels the run for the one before it, so the comment always
# carries the verdict on the newest commit.
concurrency:
  group: weeder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  weeder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the one comment weeder writes and edits
    steps:
      - uses: actions/checkout@v6
        with:
          # weeder diffs against the base branch, so the base branch has to be
          # in the clone. A shallow one does not carry it.
          fetch-depth: 0

      # Installs the weeder released with this tag, checks it against the
      # SHA-256 published beside it, judges the pull request and writes the
      # comment.
      - uses: jahala/weeder@v0.5.0
