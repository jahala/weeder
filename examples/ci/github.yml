# weeder on a pull request.
#
# Copy this to .github/workflows/weeder.yml in your own repository. It judges the
# pull request against the branch it is opening onto, writes SARIF, and hands
# that to GitHub's code scanning, so every finding lands as an annotation on the
# diff a reviewer is already reading.
#
# The job fails when weeder blocks: `weeder check` leaves with 2 for a block-level
# finding, 0 for a clean run or warnings only, and 3 when it could not run at
# all. The upload runs either way, because the run that blocked is exactly the
# one whose findings a reviewer needs to see.

name: weeder

on:
  pull_request:

permissions:
  contents: read

jobs:
  weeder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # code scanning reads the SARIF this job uploads
    steps:
      - uses: actions/checkout@v6
        with:
          # weeder diffs against the base branch, so the base branch has to be
          # in the clone. A shallow one does not carry it.
          fetch-depth: 0

      - name: Install weeder
        env:
          # The release asset for this runner. Every release publishes one
          # tarball per platform, with its SHA-256 beside it.
          WEEDER_TARGET: x86_64-unknown-linux-musl
        run: |
          base=https://github.com/jahala/weeder/releases/latest/download
          asset="weeder-$WEEDER_TARGET.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$asset" -O "$base/$asset.sha256"
          # The archive is opened only once it is the one the release published.
          sha256sum -c "$asset.sha256"
          mkdir -p weeder-bin
          tar xzf "$asset" -C weeder-bin weeder
          echo "$RUNNER_TEMP/weeder-bin" >> "$GITHUB_PATH"

      - name: Judge the pull request
        run: weeder check --base origin/${{ github.base_ref }} --strict --format sarif > weeder.sarif

      - name: Upload the findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: weeder.sarif
          category: weeder
