name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The self-check judges the whole repository against its root commit, so
      # the runner needs the history, not the one commit a shallow clone holds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@f4371d1ec7179bfbd04a82a81e3b3af7f720750f # ratchet:Swatinem/rust-cache@v2
      # The adversarial matrix runs each language's own test runner: `weeder bite`
      # judges what a suite did, so the suite has to be a real one. node, go and
      # the interpreter are pinned here rather than taken as whatever the image
      # happens to ship, so a cell that fails fails for weeder's reasons.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"
      # Ubuntu 24.04 restricts unprivileged user namespaces, and the offline
      # proof in tests/scan_offline.rs needs one to take the network away from
      # the process it starts. Lifting the restriction keeps that proof real
      # here rather than skipped.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Whether a pull request changed code or only prose (#35). The check job
  # runs either way, because the self-check judges every file in the tree and
  # several tests read the docs; only the latency job skips a pull request of
  # prose. A push to master is always code, so the main line runs both.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # The script asks git for the range itself, renames split into the
        # path left and the path reached, and reads a range git cannot answer
        # for as code.
        run: |
          if [ "$EVENT" = pull_request ]; then
            bash scripts/ci-changes.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # The latency budget is measured on the release binary, so the suite runs a
  # second time on the release profile. A rule that starts reading a file it did
  # not need, or a seam that stops being lazy, shows up here as a failing test
  # rather than as a slow gate somebody notices months later. Same invocation as
  # the debug run: whatever the budget covers has to be inside what CI runs.
  # Prose changes neither the binary nor what the budget times, so a pull
  # request made only of prose skips it, and the job reports skipped. Only a
  # plain `false` skips it: a changes job that failed answers nothing, and
  # without `always()` a failed `needs` would skip this job, which a required
  # check reads as a pass.
  latency:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-latest
    steps:
      # The self-check judges the whole repository against its root commit, so
      # the runner needs the history, not the one commit a shallow clone holds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@f4371d1ec7179bfbd04a82a81e3b3af7f720750f # ratchet:Swatinem/rust-cache@v2
        with:
          key: release
      # The adversarial matrix runs each language's own test runner: `weeder bite`
      # judges what a suite did, so the suite has to be a real one. node, go and
      # the interpreter are pinned here rather than taken as whatever the image
      # happens to ship, so a cell that fails fails for weeder's reasons.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.12"
      # Ubuntu 24.04 restricts unprivileged user namespaces, and the offline
      # proof in tests/scan_offline.rs needs one to take the network away from
      # the process it starts. Lifting the restriction keeps that proof real
      # here rather than skipped.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --workspace --release
