# Dependabot configuration, version updates only.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Ecosystems present in weed:
#   - cargo  (root Cargo.toml, the binary crate; tilth-core is a git dependency pinned by rev and is bumped by hand)
#   - npm    (npm/package.json, the download wrapper)
#   - github-actions (workflow action versions)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
